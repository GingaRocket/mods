; ============================================================================
;  GTA IV Collectibles Map
;  Shows the Flying Rats / seagulls and Unique Stunt Jumps you have not yet
;  collected, directly on the in-game pause map and radar.
;
;  Everything below except MenuKey can also be changed in-game from the settings
;  panel, and edits there are written back to this file. Comments and ordering
;  here are preserved when that happens.
; ============================================================================

; --- Which collectibles to track --------------------------------------------

; Flying Rats in GTA IV, seagulls in The Lost and Damned / The Ballad of Gay Tony.
; The right set is chosen automatically from the running episode.
ShowBirds = true

ShowStuntJumps = true

; --- Already-collected items ------------------------------------------------

; Also draw what you have already collected, faded, instead of only what is left.
ShowAll = false

; Whether faded collected items are also promoted onto the minimap when you are
; near them. Has no effect while ShowAll is false.
ShowAllOnMinimap = false

; Opacity of collected markers, 0.0 - 1.0.
; Note that transparency alone is unreliable: a faded blip blends into whatever is
; beneath it, and the pause map runs from dark water to pale land. CollectedScale
; below provides a size cue that does not depend on the background.
CollectedAlpha = 0.35

; Size of collected markers relative to MarkerScale.
CollectedScale = 0.6

; --- Appearance -------------------------------------------------------------

; Blip colours. GTA IV takes a fixed palette, not RGB, so these must be one of:
;   White, Orange, Violet, DarkOrange, Teal, Cyan, DarkGreen,
;   Purple, LightPurple, LightOrange
;
; The rest of the palette is deliberately unavailable because the game already
; uses it: Yellow for mission routes and waypoints, Green for your own waypoints
; and safehouses, Red for enemies, Magenta/DarkPink for gangs, Black is invisible.
; Blue is excluded for a different reason - the game forces any blip set to it to
; read "Friend".
BirdColour = Teal
StuntJumpColour = DarkOrange

; Base marker size. Kept small so 200 markers stay separable in dense Algonquin.
MarkerScale = 0.7

; --- Radar ------------------------------------------------------------------

; Every uncollected item always appears on the full pause map. Only those within
; this distance (metres) are also shown on the minimap, so it does not clutter.
RadarRadius = 250

; How often to rescan the game, in milliseconds.
RefreshIntervalMs = 1500

; --- Diagnostics ------------------------------------------------------------

; Verbose logging to the ScriptHookDotNet console and GtaCollectiblesMap.log.
DebugLogging = false

; Virtual-key code that opens the settings panel. 0x76 is F7.
; This one is read only at startup; changing it needs a script reload.
MenuKey = 118
